  --blue:#1f62e0; --blue2:#1f62e0; --green:#1b855e; --yellow:#a77d00; --orange:#c25e00; --red:#d0294a; --purple:#8a4fb3;

<script>
const APP = { v:"4.1", date:"2026-11-03", notes:["Усе на одному екрані: щит зверху, компактна панель знизу у 2–4 рядки, без прокрутки й спливних вікон","Апарати — за категоріями картками; торкніться апарата — його налаштування з’являться в тій самій панелі вкладками","Гребінку більше не показано постійно: вона в картці автомата 1P, вкладка «Місце»","Результат перевірки — по одній помилці зі стрілками ◀ ▶; журнал подій — одним рядком, торкніться для всього списку","Навантаження й аварії групи — у картці групового автомата"] };
"use strict";
/* ===== Модель v2: реєстр типів, стан, допоміжні функції ===== */
const T = {};   // апарати на DIN-рейці
const FT = {};  // польове обладнання (двигуни, СЕС, клапани…)
const defType = (k, d) => { d.k = k; T[k] = d; };
const defField = (k, d) => { d.k = k; FT[k] = d; };
const SLOTS = 12;
const CAB = {1.5:10,2.5:16,4:25,6:32,10:50,16:63,25:80,35:100,50:125};
const SECS = [1.5,2.5,4,6,10,16,25,35,50];
const U_MIN = 170, U_MAX = 250, KV_DELAY = 3;
const GCOL = ["#ff9830","#5b8ff0","#4fae4f","#b877d9","#e85c8a","#e0b400","#3fb6c9","#e8735a"];
const LOADS = [["Плита",4.0],["Духова шафа",3.5],["Електрокотел",6.0],["Чайник",2.0],["Мікрохвильовка",1.2],["Пральна машина",2.2],
  ["Посудомийна машина",1.8],["Бойлер",2.0],["Холодильник",0.15],["Кондиціонер",1.0],["Обігрівач",2.0],["Тепла підлога",1.5],
  ["Пилосос",1.6],["Праска",2.2],["Комп’ютер",0.35],["Телевізор",0.15],["Фен",1.8],["Сушильна машина",2.5],["Блендер",0.6],
  ["Тостер",0.9],["Зарядки",0.02],["Освітлення",0.1],["Роутер",0.01],["Домофон",0.02],["Газовий котел",0.15],["Насос",0.75],["Зарядка електромобіля",3.7]];
// Види дротів: колір і підпис
const WK = { L:["Фаза L","#e0352b"], L1:["L1","#8b5a2b"], L2:["L2","#26282c"], L3:["L3","#9aa0a6"], N:["Нуль N","#2f6fdf"],
  PE:["PE",null], C:["Керування","#f08c2e"], "DC+":["DC +","#d42a4a"], "DC-":["DC −","#26282c"] };
const PHK = ["L","L1","L2","L3"];
// Сумісність виду дроту з роллю клеми
function kindFits(kind, role){
  if(!role || role==="any") return true;
  if(role==="DC") return kind==="DC+"||kind==="DC-";
  if(role==="P"||role==="L") return PHK.includes(kind)||kind==="C";
  if(role==="C") return kind!=="PE" && kind!=="DC+" && kind!=="DC-";
  if(PHK.includes(role)) return PHK.includes(kind)||kind==="C";
  return kind===role;
}
const inA = r => parseFloat(String(r).replace(",",".").replace(/^[^\d]*/,"")) || 0;
const secFor = I => SECS.find(s => CAB[s] >= I) || 50;
const fmt = (v,d=1) => (Math.round(v*10**d)/10**d).toFixed(d).replace(".",",");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let UID = 1; const uid = p => p + (UID++);

function mkGroup(i,name,sec,loads){ return {name, sec, color:GCOL[i%GCOL.length], loads:(loads||[]).map(([n,kw,on])=>({n,kw,on:!!on}))}; }
function mkDev(type, rail, slot, rating, extra){
  const t=T[type]; const d={id:uid("d"), type, rail, slot, rating:rating||t.def||"", on:true, trip:null};
  if(t.init) t.init(d);
  if(t.group && !t.groupOpt && !(extra&&(extra.group||extra.noGroup))) d.group=mkGroup(slot,"Нова група",2.5,[]);
  return Object.assign(d, extra||{});
}
function mkField(type, map, extra){ const d={id:uid("f"), type, map}; if(FT[type].init) FT[type].init(d); return Object.assign(d, extra||{}); }

const DEFAULT_BOARD = () => ({ rails:1, inputs:[{id:"in",label:"Ввід",terms:["L","N","PE"]}], xn:8, xpe:8, xt:[] });
const S = { tpl:"flat", board:DEFAULT_BOARD(), devices:[], field:[], wires:[], comb:null, src:{in:{on:false,U:230,lost:{}}}, env:{},
  mode:"mount", pend:null, pick:null, selWire:null, selDev:null, wireKind:"L", wireSec:2.5, zoom:1, log:[],
  leak:new Set(), short:new Set(), leakWarned:new Set(), arc:new Set(), arcWarned:new Set(), brand:"eua", heat:{}, sim:null, demo:null, uWarned:false };

const KEY = "shchyt-majster-v2";
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({tpl:S.tpl, board:S.board, devices:S.devices, field:S.field, wires:S.wires, comb:S.comb,
    src:S.src, env:S.env, env0:S.env0, proj:S.proj, guide:S.guide, baseSig:S.baseSig, plan:S.plan||null, UID})); }catch(e){}
  if(typeof storeProject==="function") storeProject();
}
function load(){
  try{ const j=JSON.parse(localStorage.getItem(KEY)||"null");
    if(j && Array.isArray(j.devices) && j.board){ Object.assign(S,{tpl:j.tpl, board:j.board, devices:j.devices, field:j.field||[], wires:j.wires||[],
      comb:j.comb||null, src:j.src||{}, env:j.env||{}, env0:j.env0, proj:j.proj||null, guide:j.guide||null, baseSig:j.baseSig||null, plan:j.plan||null}); UID=Math.max(UID,j.UID||1);
      for(const k of Object.keys(S.src)) S.src[k].on=false;   // після перезавантаження джерела вимкнені
      return true; } }catch(e){}
  return false;
}
const devById = id => S.devices.find(d=>d.id===id) || S.field.find(d=>d.id===id);
const railDevs = r => S.devices.filter(d=>(d.rail||0)===r);
const devAt = (r,slot) => railDevs(r).find(d=>slot>=d.slot && slot<d.slot+T[d.type].w);
function freeAt(r,slot,w,ignore){ if(r<0||r>=S.board.rails||slot<0||slot+w>SLOTS) return false;
  for(let i=slot;i<slot+w;i++){ const d=devAt(r,i); if(d&&d!==ignore) return false; } return true; }
function desig(d){
  if(!T[d.type]) return d.name || FT[d.type].pre;
  const p=T[d.type].pre; const same=S.devices.filter(x=>T[x.type].pre===p).sort((a,b)=>((a.rail||0)-(b.rail||0))||(a.slot-b.slot));
  return p+(same.findIndex(x=>x.id===d.id)+1);
}
// Клеми: "in:L", "in2:N", "xn:3", "xpe:0", "xt:U", "d12:A1"
function termDef(key){
  const [o,k]=key.split(":"); const d=S.devices.find(x=>x.id===o); if(!d) return null;
  return T[d.type].terms.find(t=>t.k===k)||null;
}
function termRole(key){
  const [o,k]=key.split(":");
  if(S.board.inputs.some(i=>i.id===o)) return k==="N"?"N":k==="PE"?"PE":k;
  if(o==="xn") return "N"; if(o==="xpe") return "PE";
  if(o==="xt"){ const x=S.board.xt.find(x=>x.k===k); return x?x.r:null; }
  const t=termDef(key); return t?t.r:null;
}
function termName(key){
  const [o,k]=key.split(":");
  const inp=S.board.inputs.find(i=>i.id===o); if(inp) return inp.label+" "+k;
  if(o==="xn") return "Шина N (XN1)"; if(o==="xpe") return "Шина PE (XPE1)";
  if(o==="xt"){ const x=S.board.xt.find(x=>x.k===k); return "Клема XT1 «"+(x?x.l:k)+"»"; }
  const d=S.devices.find(x=>x.id===o); if(!d) return key; const t=termDef(key);
  return desig(d)+" клема «"+(t?t.l:k)+"»";
}
function allTermKeys(){
  const keys=[]; for(const inp of S.board.inputs) for(const t of inp.terms) keys.push(inp.id+":"+t);
  for(let i=0;i<S.board.xn;i++) keys.push("xn:"+i); for(let i=0;i<S.board.xpe;i++) keys.push("xpe:"+i);
  for(const x of S.board.xt) keys.push("xt:"+x.k);
  for(const d of S.devices) for(const t of T[d.type].terms) keys.push(d.id+":"+t.k);
  return keys;
}
function logp(cls,msg){ const t=new Date(); const p=n=>String(n).padStart(2,"0");
  S.log.unshift({cls,msg:`${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} ${msg}`}); S.log.length=Math.min(S.log.length,60); }
/* ===== Рушій v2: мережі, потенціали, логіка апаратів, аварії, струми ===== */
const isPh = p => /\.(L|L1|L2|L3)$/.test(p);
const isDC = p => /^(pv\d*|bat)[+-]$/.test(p);
const pvDev = sid => S.field.find(f=>f.type==="pv"&&(f.sid||"pv")===sid);
const pvKW = sid => { const d=pvDev(sid); return d&&!d.fault ? (d.n||10)*0.55*(S.env.sun||0)/100*(1-(S.env["shade_"+sid]||0)/100) : 0; };
const pvVmp = sid => ((pvDev(sid)||{}).n||10)*41.7;
const srcOf = p => p.split(".")[0];
const PH_ANG = {L:0,L1:0,L2:120,L3:240};
function srcU(p){ const s=srcOf(p); if(S.src[s]) return S.src[s].U; if(s==="inv") return 230; return 0; }
const tdef = d => T[d.type] || FT[d.type];
const K = (d,k) => T[d.type] ? d.id+":"+k : (d.map[k]||"");
const groupsOf = () => S.devices.filter(d=>T[d.type].group&&d.group).sort((a,b)=>((a.rail||0)-(b.rail||0))||(a.slot-b.slot));
const g3 = d => !!T[d.type].gph;
const gL = d => d.id+":b1", gN = d => (d.type==="rcbo"||d.type==="qfn"||d.type==="afdd") ? d.id+":b2" : d.type==="qf3p" ? d.id+":b2" : d.type==="qf4p" ? d.id+":b4" : "xn:0";
const gPh = (d,X) => g3(d) ? ["b1","b2","b3"].every(t=>X.ph(d.id+":"+t)) : !!X.ph(gL(d));
const kwOf = (d,all) => d.group.loads.reduce((a,l)=>a+(all||l.on?l.kw:0),0);
const poleClosed = (d,pi) => { const t=tdef(d); return t.closed ? t.closed(d,pi) : (d.on&&!d.trip); };
const protIn = d => d.Ir || inA(d.rating);

// Ввід від інвертора (inp.inv): вихід зникає при аварії (fault) або розрядженій АКБ (low)
const invInp = id => S.board.inputs.find(i=>i.id===id&&i.inv);
const srcLive = (inp,s) => !!(s&&s.on&&!(inp.inv&&(s.fault>0||s.low)));
function invFault(id,sec,msg){ const s=S.src[id]; if(!s) return; s.fault=sec; s.ovl=0; logp("e","Інвертор: "+msg); if(typeof toast==="function") toast("Інвертор вимкнувся","e"); }
function invTick(X,dt){ let loads=null;
  for(const inp of S.board.inputs){ if(!inp.inv) continue; const s=S.src[inp.id]; if(!s) continue; if(s.soc===undefined) s.soc=80;
    if(s.fault>0){ s.fault=Math.max(0,s.fault-dt); if(!s.fault&&s.on&&!s.low) logp("ok","Інвертор знову ввімкнувся"); }
    const live=srcLive(inp,s); let P=0;
    if(live){ loads=loads||computeLoads(X); for(const l of loads){ if(!l.a||!(l.I>0)) continue; const p=X.ph(l.a); if(p&&srcOf(p)===inp.id) P+=l.I*(l.U||230)/1000; } }
    s.P=P; const kw=inp.inv.kw||5, kwh=inp.inv.kwh||5;
    if(live&&P>kw+0.05){ s.ovl=(s.ovl||0)+dt; if(s.ovl>=2) invFault(inp.id,10,`перевантаження ${fmt(P,1)} кВт при номіналі ${fmt(kw,1)} кВт — вихід вимкнено на 10 с`); } else s.ovl=0;
    const grid=S.board.inputs.some(i=>!i.inv&&srcLive(i,S.src[i.id])&&S.src[i.id].U>=187&&S.src[i.id].U<=253);
    if(P>0) s.soc=Math.max(0,s.soc-P*(dt/60)/kwh*100);          // 1 с симуляції = 1 хв
    else if(grid&&s.soc<100) s.soc=Math.min(100,s.soc+Math.min(1.5,kw/3)*(dt/60)/kwh*100);
    s.chg=P===0&&grid&&s.soc<100;
    if(!s.low&&s.soc<=5&&s.on){ s.low=true; logp("e","Інвертор: АКБ розряджено до 5 % — вихід вимкнено, щоб зберегти батарею"); if(typeof toast==="function") toast("АКБ інвертора розряджено","e"); }

  const side=def.terms.filter(x=>x.s===t.s), i=side.indexOf(t); return G.X0+d.slot*G.MW+(i+0.5)*(def.w*G.MW)/side.length; }

  if(o==="xn"||o==="xpe"||o==="xt"){ const x=g.bus.pos[key]; return x===undefined?null:{x, y:busY(), c:R, s:"u"}; }
  const d=S.devices.find(x=>x.id===o); if(!d) return null; const t=T[d.type].terms.find(t=>t.k===k); if(!t) return null; const r=d.rail||0;

function route(){

    if(A.c===B.c){ const set=(A.s==="u"||B.s==="u")?"u":"l"; items.push({w,A,B,cross:false,set,span:Math.abs(A.x-B.x)}); }
    else { if(A.c>B.c) [A,B]=[B,A]; const side=(A.x+B.x)/2<G.W/2?"L":"R", sx=sideX(side,0);

    for(let i=0;;i++){ const q=L[i]||(L[i]=[]); if(!q.some(([p,r])=>lo<r&&p<hi)){ q.push([lo,hi]); return i; } } };
  items.sort((p,q)=>p.span-q.span);

    else { const sx=sideX(it.side,3); it.la=take(it.A.c+it.A.s,it.A.x,sx); it.lb=take(it.B.c+it.B.s,it.B.x,sx); } }

    else avail=(devTop(c)-devBot(c-1)-40)*n(key)/Math.max(1,n(c+"u")+n(c+"l"));

    else { const sx=sideX(it.side,it.ls), ya=laneY(A.c,A.s,it.la), yb=laneY(B.c,B.s,it.lb); out[it.w.id]=[[A.x,A.y],[A.x,ya],[sx,ya],[sx,yb],[B.x,yb],[B.x,B.y]]; } }
  return out;
}
function rpath(pts,r=7){
  const p=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]); let d="M"+p[0][0]+" "+p[0][1];
  for(let i=1;i<p.length-1;i++){ const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];
    const l1=Math.hypot(x1-x0,y1-y0), l2=Math.hypot(x2-x1,y2-y1), rr=Math.min(r,l1/2,l2/2);
    if(rr<1||(x0===x1&&x1===x2)||(y0===y1&&y1===y2)){ d+=" L"+x1+" "+y1; continue; }
    d+=` L${(x1-(x1-x0)/l1*rr).toFixed(1)} ${(y1-(y1-y0)/l1*rr).toFixed(1)} Q${x1} ${y1} ${(x1+(x2-x1)/l2*rr).toFixed(1)} ${(y1+(y2-y1)/l2*rr).toFixed(1)}`; }

    if(mainIn&&In>=mainIn) add("w",`${desig(g)} ${g.rating} не менший за вступний`,"Немає селективності: при перевантаженні може вимкнутись увесь щит.");

        const np=nPole(R); if(o.byp||np<0||byp.some(x=>x.id===R.id)||!X.ph(gL(g))||!X.hasN(gN(g))) continue;

    if(!low&&S.wires.length) add("ok","Перерізи силових перемичок відповідають вступному автомату"); }
  if(G.length&&b.inputs.length===1&&!S.devices.some(d=>d.type==="kv")&&!S.field.some(f=>f.type==="inv")) add("w","Немає реле напруги","Без нього техніка не захищена від перенапруги.");
  for(const x of (res.tpl||[])) add(x.sev,x.t,x.d);

function atsKmPower(){ const qf1=D("qf2p",0,0,"C40",{cap:"Ввід 1 мережа"}), qf2=D("qf2p",0,2,"C40",{cap:"Ввід 2 генератор"}),

const PV_PAIRS = [["p","m"],["p2","m2"]];
const pvStrings = () => S.field.filter(f=>f.type==="pv");
const pvName = s => (s.sid||"pv")==="pv"?"PV":(s.sid||"").toUpperCase();
defField("invpv",{name:"Інвертор (входи PV)", fw:210, fh:150, terms:["p","m","p2","m2"],
  load(d,X){ const L=[]; d.ch=[];
    for(const [a,b] of PV_PAIRS){ if(!d.map[a]) continue; const P=X.P(K(d,a)), M=X.P(K(d,b));
      const ss=[...P].map(p=>/^(pv\d*)\+$/.exec(p)).filter(Boolean).map(m=>m[1]), short=ss.some(s=>P.has(s+"-")), ok=ss.filter(s=>M.has(s+"-"));
      const kw=(short||d.dead)?0:ok.reduce((t,s)=>t+pvKW(s)*0.98,0), V=ok.length?pvVmp(ok[0]):0, I=V?kw*1000/V:0;
      d.ch.push({kw,I,V,short,ok:ok.length>0&&!short,crossed:ss.length>0&&!ok.length&&[...M].some(p=>/^pv\d*-$/.test(p))}); L.push({a,b,I,U:V,dc:true}); }
    d.on=!d.dead&&d.ch.some(c=>c.ok); d.short=d.ch.some(c=>c.short); d.kw=d.ch.reduce((t,c)=>t+c.kw,0); return L; },
  draw(d,x,y){ const ch=d.ch||[], col=d.dead||d.short?"var(--red)":d.on?"var(--green)":"var(--muted)";
    let s=fbox(x,y,210,150,ch.length>1?"Інвертор · 2 MPPT":"Інвертор · вхід PV (MPPT)")+`<rect x="${x+12}" y="${y+24}" width="72" height="96" rx="6" fill="#2b2f36"/><rect x="${x+18}" y="${y+34}" width="60" height="30" rx="2" fill="#16181c"/>`
      +`<text x="${x+48}" y="${y+54}" font-size="10" text-anchor="middle" font-family="var(--mono)" fill="${d.on?"#a6e3ff":"#3a3f47"}">${d.dead?"ERR":d.short?"ISO!":d.on?fmt(d.kw,2)+"kW":"NO DC"}</text>`
      +led(x+30,y+82,d.on?"#3fbf4a":"#5a5e66")+led(x+66,y+82,d.dead||d.short?"#e23b3b":"#5a5e66");
    ch.forEach((c,i)=>{ s+=fst(x+92,y+40+i*36,`MPPT${ch.length>1?i+1:""}: ${c.short?"КЗ!":c.crossed?"переплутано!":c.ok?Math.round(c.V)+" В":"—"}`,c.short||c.crossed?"var(--red)":undefined)+fst(x+92,y+56+i*36,c.ok?`${fmt(c.I,1)} А · ${fmt(c.kw,2)} кВт`:"0 А","var(--muted)"); });
    return s+fst(x+10,y+142,d.dead?"Пошкоджено імпульсом перенапруги":d.short?"Коротке замикання на вході":d.on?"Працює від PV":"Немає напруги DC",col); }});
const invp = () => S.field.find(f=>f.type==="invpv");
const spds = () => S.devices.filter(d=>d.type==="spdc");
function spdFor(pv,f){ return spds().filter(fv=>f(k(fv,"p"))===f(pv.map.p)&&f(k(fv,"m"))===f(pv.map.m)&&f(k(fv,"pe"))===f("gnd:PE")); }
function surge(){ const f=build({ideal:true}), inv=invp(), bad=[];
  for(const pv of pvStrings()){ const ok=spdFor(pv,f).filter(fv=>(fv.wear||0)<2);
    if(ok.length){ ok.forEach(fv=>{ fv.wear=(fv.wear||0)+1; logp("ok",`Імпульс на ${pvName(pv)}: ${desig(fv)} відвів його на PE${fv.wear>=2?". Картридж відпрацював — індикатор червоний, замініть його":""}`); }); }
    else bad.push(pvName(pv)); }
  if(bad.length){ inv.dead=true; logp("e",`Імпульс перенапруги з ${bad.join(", ")} пройшов в інвертор — пошкоджено вхід MPPT! Немає справного УЗІП, з’єднаного з цим стрінгом і з PE.`); toast("Інвертор пошкоджено імпульсом","e"); }
  else toast("УЗІП відвели імпульс","ok"); }
function pvStatus(){ const inv=invp(), sun=S.env.sun||0, rows=[];
  pvStrings().forEach(pv=>{ const sid=pv.sid||"pv", c=(inv.ch||[]).find((c,i)=>{ const P=S.sim&&S.sim.X.P(K(inv,PV_PAIRS[i][0])); return P&&P.has(sid+"+"); });
    rows.push([`Стрінг ${pvName(pv)}`, sun>0?(c&&c.ok?`${Math.round(c.V)} В · ${fmt(c.I,1)} А`:`≈ ${Math.round((pv.n||10)*49.6)} В (холостий хід)`):"0 В (ніч)", sun>0?"ok":""]); });
  rows.push(["Інвертор",inv.dead?"пошкоджено":inv.short?"КЗ на вході":inv.on?"працює, "+fmt(inv.kw,2)+" кВт":"без DC",inv.dead||inv.short?"e":inv.on?"ok":"w"]);
  spds().forEach(fv=>rows.push([`УЗІП ${desig(fv)}`,(fv.wear||0)>=2?"картридж відпрацював":"справний",(fv.wear||0)>=2?"e":"ok"]));
  rows.push(["Дуга DC",S.env.arc?"ГОРИТЬ":"немає",S.env.arc?"e":"ok"]); return rows; }
function pvChecks(add){ const f=build({ideal:true}), fus=S.devices.filter(d=>d.type==="fudc"), vmax=Math.min(...spds().map(d=>d.uc||1000),...S.devices.filter(d=>d.type==="qfdc").map(d=>d.uc||1000));
  for(const pv of pvStrings()){ const nm=pvName(pv), on=key=>fus.some(d=>f(k(d,"b"))===f(key)||f(k(d,"t"))===f(key));
    if(on(pv.map.p)&&on(pv.map.m)) add("ok",`${nm}: запобіжники на обох полюсах`); else add("w",`${nm}: запобіжник лише на одному полюсі або немає`,"Для незаземленого стрінга ставлять запобіжники на + і −.");
    add(spdFor(pv,f).length?"ok":"e",spdFor(pv,f).length?`${nm}: УЗІП між + / − і PE`:`${nm}: немає УЗІП або він не з’єднаний з PE`,spdFor(pv,f).length?"Імпульс перенапруги піде в землю, а не в інвертор.":"Клеми УЗІП мають іти на + і − цього стрінга, вивід PE — на заземлення.");
    const voc=(pv.n||10)*49.6; add(voc*1.1<=vmax?"ok":"e",`${nm}: Voc ${Math.round(voc)} В, узимку ≈ ${Math.round(voc*1.1)} В`,voc*1.1<=vmax?`У межах ${vmax} В апаратів щита.`:`Перевищує ${vmax} В апаратів щита — зменшіть кількість панелей у стрінгу.`); }
  for(const d of fus){ const In=inA(d.rating); if(In<21) add("w",`${desig(d)} gPV ${d.rating} замалий для панелей 550 Вт`,"Номінал вставки — не менше 1,5 × Isc ≈ 21 А, інакше вона може згоріти в сонячний день.");
    else if(In>25) add("w",`${desig(d)} gPV ${d.rating} завеликий`,"Не більше за максимальний струм запобіжника панелі (зазвичай 25 А)."); }
  add("ok","Один стрінг на канал: запобіжники — додатковий захист","Обов’язкові вони зазвичай від 3 паралельних стрінгів, коли зворотний струм інших стрінгів може перевищити допустимий для панелі."); }
function pvChannel(slot,n,xp,xm,ip,im,pe,o){ const fu1=D("fudc",0,slot,o.fuse,{model:o.fmodel,uc:o.uc,cap:`PV${n} +`}), fu2=D("fudc",0,slot+o.gap1,o.fuse,{model:o.fmodel,uc:o.uc,cap:`PV${n} −`}),

  W(xp,k(fu1,"b"),"DC+",4); W(xm,k(fu2,"b"),"DC-",4); W(k(fu1,"t"),k(fv,"p"),"DC+",4); W(k(fu1,"t"),k(qf,"p1"),"DC+",4);
  W(k(fu2,"t"),k(fv,"m"),"DC-",4); W(k(fu2,"t"),k(qf,"m1"),"DC-",4); W(k(fv,"pe"),pe,"PE",6); W(k(qf,"p2"),ip,"DC+",4); W(k(qf,"m2"),im,"DC-",4); }

/* ===== Масштаб щита двома пальцями (і щипком на тачпаді) ===== */
(function(){
  const sc=$("scroller"), Z_MIN=0.3, Z_MAX=4; let pin=null, blockClickUntil=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  function zoomAt(z,cx,cy){ // тримаємо точку щита під (cx,cy) на місці
    const svg=$("svg"), r=svg.getBoundingClientRect(), fx=(cx-r.left)/r.width, fy=(cy-r.top)/r.height;
    z=Math.max(Z_MIN,Math.min(Z_MAX,z)); S.zoom=z; svg.style.width=(z*100)+"%"; $("zFit").textContent=Math.round(z*100)+"%";
    const r2=svg.getBoundingClientRect(), sr=sc.getBoundingClientRect();
    sc.scrollLeft=Math.max(0,fx*r2.width-(cx-sr.left)); sc.scrollTop=Math.max(0,fy*r2.height-(cy-sr.top));
  }
  sc.addEventListener("touchstart",e=>{ if(e.touches.length===2){ const m=mid(e.touches); pin={d:dist(e.touches), z:S.zoom, x:m.x, y:m.y}; } },{passive:true});
  sc.addEventListener("touchmove",e=>{ if(!pin||e.touches.length!==2) return; e.preventDefault(); const m=mid(e.touches);
    zoomAt(pin.z*dist(e.touches)/pin.d, m.x, m.y); },{passive:false});
  const end=e=>{ if(pin&&e.touches.length<2){ pin=null; blockClickUntil=Date.now()+350; } };
  sc.addEventListener("touchend",end,{passive:true}); sc.addEventListener("touchcancel",end,{passive:true});
  sc.addEventListener("click",e=>{ if(Date.now()<blockClickUntil){ e.stopPropagation(); e.preventDefault(); } },true);
  sc.addEventListener("wheel",e=>{ if(!e.ctrlKey) return; e.preventDefault(); zoomAt(S.zoom*Math.exp(-e.deltaY*0.01), e.clientX, e.clientY); },{passive:false});
})();
/* ===== Версія, перевірка й встановлення оновлень ===== */
(function(){
  const fmtD = s => String(s).split("-").reverse().join(".");
  const cmp = (a,b) => { const x=String(a).split(".").map(Number), y=String(b).split(".").map(Number);
    for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
  const btn=$("updBtn"), modal=$("upd"); let remote=null;
  $("ver").textContent=`v${APP.v} · ${fmtD(APP.date)}`;
  async function fetchRemote(){ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
  function show(mode,info){
    const isNew=mode==="new";
    $("updCard").innerHTML=`<h2 id="updTitle">${isNew?"Доступна нова версія":"Що нового"}</h2>
      <p class="mono upd-v">${isNew?`v${esc(APP.v)} → <b>v${esc(info.v)}</b> від ${fmtD(info.date)}`:`v${esc(info.v)} від ${fmtD(info.date)}`}</p>
      <div class="row" style="justify-content:flex-end">${isNew?`<button class="btn" data-upd="later">Пізніше</button><button class="btn primary" data-upd="go">Оновити зараз</button>`:""}</div>
      <ul>${(info.notes||[]).slice(0,8).map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
      ${isNew?`<p class="hint">Зібрані щити й проєкти збережуться.</p>`:""}
      <div class="row" style="justify-content:flex-end">${isNew?"":`<button class="btn primary" data-upd="later">Закрити</button>`}</div>`;
    modal.hidden=false; const f=modal.querySelector(".btn.primary"); if(f) f.focus(); }
  async function check(silent){
    try{ remote=await fetchRemote();
      if(cmp(remote.v,APP.v)>0){ btn.classList.add("has"); btn.title=`Доступна версія v${remote.v}`; if(!silent) show("new",remote); }
      else { btn.classList.remove("has"); btn.title="Перевірити оновлення"; if(!silent) toast(`У вас остання версія v${APP.v} від ${fmtD(APP.date)}`,"ok"); } }
    catch(e){ if(!silent) toast("Не вдалося перевірити оновлення. Перевірте підключення до інтернету.","w"); } }
  const swUpdate = () => new Promise((res,rej)=>{ const ch=new MessageChannel(); ch.port1.onmessage=e=>e.data&&e.data.ok?res():rej(new Error("sw"));
    navigator.serviceWorker.controller.postMessage({type:"update"},[ch.port2]); setTimeout(()=>rej(new Error("timeout")),15000); });
  async function apply(){ save(); toast("Завантажую нову версію…");
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){ try{ await swUpdate(); location.reload(); return; }catch(e){ toast("Не вдалося завантажити оновлення. Спробуйте пізніше.","w"); return; } }
    const u=new URL(location.href); u.searchParams.set("v",remote.v); location.replace(u.toString()); }
  document.addEventListener("click",e=>{
    if(e.target.closest("#updBtn")){ check(false); return; }
    if(e.target.closest("#ver")){ show("cur",APP); return; }
    const b=e.target.closest("[data-upd]"); if(b){ modal.hidden=true; if(b.dataset.upd==="go"&&remote) apply(); return; }
    if(e.target===modal) modal.hidden=true; });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!modal.hidden) modal.hidden=true; if((e.key==="Enter"||e.key===" ")&&e.target.id==="ver"){ e.preventDefault(); show("cur",APP); } });
  try{ const last=localStorage.getItem("shchyt-ver");
    if(last&&last!==APP.v) setTimeout(()=>toast(`Оновлено до v${APP.v} від ${fmtD(APP.date)}`,"ok"),600);
    localStorage.setItem("shchyt-ver",APP.v); }catch(e){}
  try{ const u=new URL(location.href); if(u.searchParams.has("v")){ u.searchParams.delete("v"); history.replaceState(null,"",u.toString()); } }catch(e){}
  setTimeout(()=>check(true),1500); setInterval(()=>check(true),30*60*1000);
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent/.test(location.host)) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
/* ===== Документи: однолінійна схема, кабельний журнал, специфікація, маркування ===== */
const RHO = 0.0178;   // мідь, Ом·мм²/м
const cableCores = g => g3(g) ? (g.type==="qf4p"?5:4) : 3;
const cableName = g => `ВВГнг(А)-LS ${cableCores(g)}×${fmt(g.group.sec,g.group.sec%1?1:0)}`;
const groupLen = g => (S.planLen&&S.planLen[g.id]!==undefined) ? S.planLen[g.id] : (g.group.len||null);
const groupI = g => kwOf(g,true)*1000/(g3(g)?1.732*400:230);
function groupDU(g){ const L=groupLen(g); if(!L) return null; const I=groupI(g), s=g.group.sec; return g3(g) ? 1.732*L*I*RHO/s/400*100 : 2*L*I*RHO/s/230*100; }
const ferrule = s => `НШВИ ${fmt(s,s%1?1:0)}-${s>=6?12:s>=4?10:8}`;
function wireLenCm(w){ const P=route()[w.id]; if(!P) return 0; let L=0; for(let i=1;i<P.length;i++) L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]); return Math.round(L*0.0324+4); }  // 54 од. = модуль 17,5 мм; +4 см на зачистку

// ---- Топологія для однолінійної схеми: дерево від вводів через апарати з полюсами L
function sldModel(){ const f=build({allOpen:true}), b=S.board, nodes=[], byId={};
  const add=n=>{ nodes.push(n); byId[n.id]=n; n.kids=[]; n.extra=[]; n.side=[]; return n; };
  for(const i of b.inputs) if(i.terms.some(t=>/^L/.test(t))) add({id:i.id, kind:"in", label:i.label, ph:i.terms.includes("L1")?3:1, out:i.terms.filter(t=>/^L/.test(t)).map(t=>f(i.id+":"+t)), inv:!!i.inv});
  const Lp=d=>(T[d.type].poles||[]).filter(p=>p.r!=="N");
  for(const d of S.devices){ const ps=Lp(d); if(!ps.length||T[d.type].cat==="СЕС") continue;
    add({id:d.id, kind:"dev", d, ph:ps.length>=3?3:1, inn:[...new Set(ps.map(p=>f(K(d,p.a))))], out:[...new Set(ps.map(p=>f(K(d,p.b))))]}); }
  for(const n of nodes) if(n.kind==="dev"){ const par=[];
    for(const net of n.inn) for(const m of nodes) if(m!==n&&m.out.includes(net)&&!par.includes(m)) par.push(m);
    n.par=par; }
  // поле: двигуни, лампи, бойлери — листки від апарата, з виходом якого з’єднана їхня перша клема
  for(const fd of S.field){ const ft=FT[fd.type], k0=fd.map[ft.terms[0]]; if(!k0||/^(pv|bat|invpv|inv)/.test(fd.type)) continue;
    const net=f(k0), m=nodes.find(x=>x.out.includes(net)); if(!m) continue; const n=add({id:fd.id, kind:"fld", fd, ph:ft.terms.includes("U")?3:1, inn:[net], out:[]}); n.par=[m]; }
  // бічні: УЗІП, вольтметр, розетка DIN, реле контролю фаз
  for(const d of S.devices){ if(Lp(d).length) continue; const t=T[d.type], tm=t.terms.find(q=>["L","P","L1"].includes(q.r)&&q.s==="top"); if(!tm||!["spdac","spd3","vm","sock","kvf"].includes(d.type)) continue;
    const net=f(K(d,tm.k)), m=nodes.find(x=>x.out.includes(net)); if(m) m.side.push(d); }
  for(const n of nodes){ if(!n.par||!n.par.length) continue; n.par[0].kids.push(n); for(const p of n.par.slice(1)) p.extra.push(n); }
  const roots=nodes.filter(n=>n.kind==="in"), orphan=nodes.filter(n=>n.kind!=="in"&&(!n.par||!n.par.length));
  const sortK=n=>n.kind==="dev"?((n.d.rail||0)*100+n.d.slot):1e4;
  for(const n of nodes) n.kids.sort((a,c)=>sortK(a)-sortK(c));
  return {roots, orphan, nodes}; }

function symSVG(n,x,y){ const L=(a,b2,c,d2,w)=>`<line x1="${a}" y1="${b2}" x2="${c}" y2="${d2}" stroke="#111" stroke-width="${w||1.6}"/>`;
  const sw=(cross,semi)=>L(x,y,x,y+12)+L(x,y+32,x,y+44)+L(x,y+32,x-9,y+14)+(cross?L(x-4,y+8,x+4,y+16,1.4)+L(x+4,y+8,x-4,y+16,1.4):"")+(semi?`<path d="M${x-4} ${y+12} a4 4 0 0 0 8 0" fill="none" stroke="#111" stroke-width="1.4"/>`:"");
  const box=t=>L(x,y,x,y+8)+`<rect x="${x-14}" y="${y+8}" width="28" height="26" fill="#fff" stroke="#111" stroke-width="1.4"/><text x="${x}" y="${y+25}" font-size="9" text-anchor="middle" font-weight="700">${t}</text>`+L(x,y+34,x,y+44);
  const oval=`<ellipse cx="${x}" cy="${y+38}" rx="7" ry="3.5" fill="none" stroke="#111" stroke-width="1.3"/>`;
  if(n.kind==="in") return `<path d="M${x-12} ${y+4} h24 l-12 14 z" fill="#111"/>`+L(x,y+18,x,y+44);
  if(n.kind==="fld"){ const t=n.fd.type; return L(x,y,x,y+10)+(/^motor/.test(t)?`<circle cx="${x}" cy="${y+24}" r="13" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="${x}" y="${y+28}" font-size="11" text-anchor="middle" font-weight="700">M</text>`
      :`<circle cx="${x}" cy="${y+24}" r="11" fill="#fff" stroke="#111" stroke-width="1.5"/>`+L(x-8,y+16,x+8,y+32,1.2)+L(x+8,y+16,x-8,y+32,1.2)); }
  const d=n.d, t=T[d.type];
  if(t.prot==="fuse") return L(x,y,x,y+8)+`<rect x="${x-5}" y="${y+8}" width="10" height="28" fill="#fff" stroke="#111" stroke-width="1.4"/>`+L(x,y+8,x,y+36,1)+L(x,y+36,x,y+44);
  if(t.rcd&&t.prot) return sw(true)+oval;
  if(t.rcd) return sw(false)+oval+`<text x="${x+10}" y="${y+42}" font-size="7">ΔI</text>`;
  if(t.prot) return sw(true);
  if(t.meter) return box("kWh"); if(d.type==="kv") return box("U"); if(d.type==="pef") return box("L→"); if(d.type==="ats") return box("АВР");
  if(/^km|^kimp|^stair|^ssw|^photo|^rel/.test(d.type)) return sw(false,true);
  return sw(false); }

function sldSVG(){ const M=sldModel(), CW=104, LH=112, X0=128, top=26; let col=0, maxDepth=0;
  const lay=(n,dep)=>{ n.dep=dep; maxDepth=Math.max(maxDepth,dep); if(!n.kids.length){ n.x=X0+col*CW+CW/2; n.col=col++; return; } n.kids.forEach(k=>lay(k,dep+1)); n.x=(n.kids[0].x+n.kids[n.kids.length-1].x)/2; };
  M.roots.forEach(r=>lay(r,0)); M.orphan.forEach(o=>lay(o,1));
  const leaves=M.nodes.filter(n=>n.col!==undefined), W=Math.max(640,X0+col*CW+20), Y=n=>top+n.dep*LH, yT=top+(maxDepth+1)*LH+10;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${yT+8*22+40}" style="min-width:${Math.max(320,col*76+100)}px;background:#fff" font-family="IBM Plex Sans,Arial,sans-serif">`;
  s+=`<text x="8" y="16" font-size="12" font-weight="700">Однолінійна схема · ${esc((S.proj&&S.proj.name)||"Щит")} · ЩРН-${S.board.rails*12}</text>`;
  const lbl=(n,x,y)=>{ let a,b2,c="";
    if(n.kind==="in"){ a=n.label; b2=(n.ph===3?"3~ 400 В":"1~ 230 В")+(n.inv?" · інвертор":""); }
    else if(n.kind==="fld"){ a=n.fd.name||FT[n.fd.type].name; b2=""; }
    else { const d=n.d; a=desig(d)+(d.rating?" "+d.rating+(T[d.type].unit||""):""); b2=modelOf(d)||T[d.type].short; if(T[d.type].rcd) c="ΔI 30 мА"; }
    return `<text x="${x+13}" y="${y+18}" font-size="9.5" font-weight="700">${esc(a)}</text><text x="${x+13}" y="${y+29}" font-size="8">${esc(String(b2).slice(0,20))}</text>`+(c?`<text x="${x+13}" y="${y+39}" font-size="8">${c}</text>`:""); };
  for(const n of M.nodes){ if(n.x===undefined) continue; const y=Y(n);
    s+=symSVG(n,n.x,y)+lbl(n,n.x,y)+(n.ph===3?`<g stroke="#111" stroke-width="1.1"><line x1="${n.x-5}" y1="${y+48}" x2="${n.x+5}" y2="${y+42}"/><line x1="${n.x-5}" y1="${y+52}" x2="${n.x+5}" y2="${y+46}"/><line x1="${n.x-5}" y1="${y+56}" x2="${n.x+5}" y2="${y+50}"/></g>`:"");
    n.side.forEach((sd,i)=>{ const sx=n.x+58+i*34, sy=y+52; s+=`<line x1="${n.x}" y1="${sy}" x2="${sx}" y2="${sy}" stroke="#111" stroke-width="1.2"/><circle cx="${n.x}" cy="${sy}" r="2" fill="#111"/>`
      +`<rect x="${sx-10}" y="${sy}" width="20" height="18" fill="#fff" stroke="#111" stroke-width="1.2"/><text x="${sx}" y="${sy+12}" font-size="7" text-anchor="middle">${/^spd/.test(sd.type)?"УЗІП":sd.type==="vm"?"V":sd.type==="sock"?"XS":"KV"}</text><text x="${sx}" y="${sy+28}" font-size="7" text-anchor="middle">${esc(desig(sd))}</text>`; });
    if(n.kids.length){ const yb=y+LH-20; s+=`<line x1="${n.x}" y1="${y+44}" x2="${n.x}" y2="${yb}" stroke="#111" stroke-width="1.6"/>`;
      if(n.kids.length>1) s+=`<line x1="${n.kids[0].x}" y1="${yb}" x2="${n.kids[n.kids.length-1].x}" y2="${yb}" stroke="#111" stroke-width="2.4"/>`;
      for(const k of n.kids) s+=`<line x1="${k.x}" y1="${yb}" x2="${k.x}" y2="${Y(k)}" stroke="#111" stroke-width="1.6"/>`; }
    for(const e of n.extra){ const ye=Y(e)-10; s+=`<path d="M${n.x} ${y+44} V${ye} H${e.x+6} V${Y(e)+2}" fill="none" stroke="#111" stroke-width="1.4" stroke-dasharray="5 3"/>`; }
    if(n.col!==undefined&&n.kind!=="in"&&!n.extra.length) s+=`<line x1="${n.x}" y1="${y+44}" x2="${n.x}" y2="${yT}" stroke="#111" stroke-width="1.2"/><path d="M${n.x-4} ${yT-8} L${n.x} ${yT} L${n.x+4} ${yT-8}" fill="none" stroke="#111" stroke-width="1.2"/>`; }
  // таблиця під схемою
  const rows=[["Позначення",n=>n.kind==="dev"?desig(n.d):n.kind==="fld"?(n.fd.name||"M"):""],["Апарат",n=>n.kind==="dev"?(n.d.rating||""):""],["Кабель",n=>n.kind==="dev"&&n.d.group?cableName(n.d).replace("ВВГнг(А)-LS ",""):""],
    ["Довжина, м",n=>n.kind==="dev"&&n.d.group&&groupLen(n.d)?fmt(groupLen(n.d),1):""],["Pвст, кВт",n=>n.kind==="dev"&&n.d.group?fmt(kwOf(n.d,true),2):n.kind==="fld"?fmt(FT[n.fd.type].kw||((FT[n.fd.type].In||0)*0.23),1):""],
    ["Iр, А",n=>n.kind==="dev"&&n.d.group?fmt(groupI(n.d),1):""],["ΔU, %",n=>{ if(n.kind!=="dev"||!n.d.group) return ""; const u=groupDU(n.d); return u===null?"":fmt(u,1); }],
    ["Споживач",n=>n.kind==="dev"&&n.d.group?n.d.group.name:n.kind==="fld"?FT[n.fd.type].name:""]];
  rows.forEach(([h,fn],i)=>{ const ry=yT+i*22; s+=`<rect x="8" y="${ry}" width="${W-16}" height="22" fill="${i%2?"#f6f7f8":"#fff"}" stroke="#9aa0a6" stroke-width=".8"/><text x="14" y="${ry+15}" font-size="9" font-weight="600">${h}</text>`;
    for(const n of leaves){ const v=fn(n); if(v===""||v===undefined) continue; const bad=h==="ΔU, %"&&parseFloat(String(v).replace(",","."))>4;
      s+=`<text x="${n.x}" y="${ry+15}" font-size="${h==="Споживач"?7.6:8.6}" text-anchor="middle"${bad?' fill="#b3261e" font-weight="700"':""}>${esc(String(v).slice(0,h==="Споживач"?22:16))}</text>`; } });
  for(const n of leaves) s+=`<line x1="${n.x-CW/2}" y1="${yT}" x2="${n.x-CW/2}" y2="${yT+rows.length*22}" stroke="#9aa0a6" stroke-width=".6"/>`;
  return s+`</svg>`; }

// ---- Таблиці
const tbl = (head,rows,num=[]) => `<div class="tw"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${num.includes(i)?' class="n"':""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function cabData(){ const ends={}; for(const w of S.wires) for(const k of [w.a,w.b]) ends[k]=(ends[k]||0)+1;
  const inner=S.wires.map((w,i)=>[String(i+1),`W${i+1}`,termName(w.a),termName(w.b),WK[w.kind][0]+(w.col?" · "+WCOL[w.col][0].toLowerCase():""),fmt(w.sec,w.sec%1?1:0)+" мм²",String(wireLenCm(w)),ferrule(w.sec)+" ×2"]);
  const lines=groupsOf().map(g=>[desig(g)+" "+g.rating,g.group.name,cableName(g),groupLen(g)?fmt(groupLen(g),1):"—",(S.planRooms&&S.planRooms[g.id])||"—",(()=>{ const u=groupDU(g); return u===null?"—":fmt(u,1); })()]);
  return {inner,lines}; }
function specData(){ const R=[], cnt=new Map(), addR=(name,model,qty,unit)=>R.push([name,model,qty,unit]);
  for(const d of S.devices){ const t=T[d.type], key=[t.name,brandName(d),modelOf(d)||d.rating||""].join("|"); cnt.set(key,(cnt.get(key)||0)+1); }
  for(const [k,n] of cnt){ const [nm,br,md]=k.split("|"); addR(nm+(br!=="EnergyUA"?" · "+br:""),md,String(n),"шт."); }
  addR(`Корпус ЩРН-${S.board.rails*12} (${S.board.rails} рейк${S.board.rails>1?"и":"а"} DIN)`,"","1","шт.");

  if(g.cur<0){ S.devFilter=null; return `<div class="br gd"><span class="gk">✓</span><b class="gt">Щит зібрано і випробувано</b><button class="bx" data-gx aria-label="Сховати помічника">✕</button></div>`; }
  const s=g.s; if(S.devFilter&&S.devFilter.step!==s.id) S.devFilter=null;
  return `<div class="br gd"><span class="gk">${g.cur+1}/${g.st.length}</span><b class="gt">${esc(s.short||s.t)}</b>${s.act?`<button class="btn sm primary" data-gact="${g.cur}">${esc(s.act[0])}</button>`:""}<button class="btn sm" data-gskip="${s.id}">Пропустити</button><button class="bx" data-gx aria-label="Сховати помічника">✕</button></div>`; }
/* ===== План приміщень: кімнати, щит, розетки, вимикачі, світло, виводи; траси й довжини кабелів по групах ===== */
const PX = 60;   // 1 м = 60 одиниць SVG
const PIT = { s:["Розетка",0.3], s2:["Розетка подвійна",0.3], sw:["Вимикач",0.9], lt:["Світильник",null], ap:["Вивід під прилад",0.6] };
const PTOOLS = [["sel","Вибір"],["room","Кімната"],["board","Щит"],["s","Розетка"],["s2","Розетка ×2"],["sw","Вимикач"],["lt","Світло"],["ap","Вивід"],["del","Видалити"]];
const RCOL = ["#f6e3c8","#e6def3","#dcefe0","#dce8f5","#f5dde3","#efeccf","#d9f0f0"];
function planObj(){ if(!S.plan) S.plan={rooms:[],items:[],board:{x:1,y:0.4},ceil:2.7,route:"ceil",res:10}; return S.plan; }
const snapM = v => Math.round(v*10)/10;
const gById = id => S.devices.find(d=>d.id===id&&d.group);
const roomAt = (x,y) => planObj().rooms.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
function itemH(it){ const P=planObj(); return it.h!==undefined?it.h:(PIT[it.type][1]??P.ceil); }

// ---- Розрахунок довжин: ланцюжок від щита до найближчої точки, далі до наступної (траса по осях), плюс спуски й запас
function planLengths(){ const P=planObj(), out={}, rooms={}, det={}, cnt={s:0,s2:0,sw:0,lt:0,ap:0}, boxes=new Set();
  const bTop=1.8, bBot=1.2;
  for(const g of groupsOf()){ const its=P.items.filter(i=>i.g===g.id); if(!its.length) continue;
    let cur={x:P.board.x+0.3,y:P.board.y+0.15}, left=its.slice(), order=[], hz=0;
    while(left.length){ left.sort((a,b)=>(Math.abs(a.x-cur.x)+Math.abs(a.y-cur.y))-(Math.abs(b.x-cur.x)+Math.abs(b.y-cur.y))); const n=left.shift(); hz+=Math.abs(n.x-cur.x)+Math.abs(n.y-cur.y); order.push(n); cur=n; }
    let vt=P.route==="ceil"?P.ceil-bTop:bBot; order.forEach((it,i)=>{ const h=itemH(it), d=P.route==="ceil"?Math.max(0,P.ceil-h):h; vt+=i<order.length-1?2*d:d; });
    const ends=0.5+order.length*0.3, tot=(hz+vt+ends)*(1+(P.res||0)/100);
    out[g.id]=Math.round(tot*10)/10; det[g.id]={order,hz,vt,ends,tot};
    rooms[g.id]=[...new Set(order.map(i=>(roomAt(i.x,i.y)||{}).name).filter(Boolean))].join(", ");
    for(const it of order){ cnt[it.type]++; const r=roomAt(it.x,it.y); boxes.add(g.id+"|"+(r?r.id:"-")); } }
  S.planLen=out; S.planRooms=rooms; S.planDet=det;
  const sp=[]; if(cnt.s) sp.push(["Розетка з заземленням","16 А, 250 В",String(cnt.s),"шт."]); if(cnt.s2) sp.push(["Розетка подвійна з заземленням","16 А, 250 В",String(cnt.s2),"шт."]);
  if(cnt.sw) sp.push(["Вимикач одноклавішний","10 А",String(cnt.sw),"шт."]); if(cnt.lt) sp.push(["Світильник (точка підключення)","",String(cnt.lt),"шт."]);
  if(cnt.ap) sp.push(["Вивід кабелю під прилад","",String(cnt.ap),"шт."]);
  const pod=cnt.s+cnt.s2+cnt.sw; if(pod) sp.push(["Підрозетник","Ø68 мм",String(pod+cnt.s2),"шт."]); if(boxes.size) sp.push(["Коробка розподільча","",String(boxes.size),"шт."]);
  const all=Object.values(out).reduce((a,b)=>a+b,0); if(all) sp.push(["Труба гофрована ПВХ","Ø20 мм",fmt(Math.ceil(all),0),"м"]);
  S.planSpec=sp; return out; }

// ---- Малювання плану
function renderPlan(){ const P=planObj(), svg=$("svg"); planLengths();
  const xs=[0,10,P.board.x+1,...P.rooms.map(r=>r.x+r.w),...P.items.map(i=>i.x)], ys=[0,8,P.board.y+1,...P.rooms.map(r=>r.y+r.h),...P.items.map(i=>i.y)];
  const W=Math.ceil(Math.max(...xs))+1, H=Math.ceil(Math.max(...ys))+1; svg.setAttribute("viewBox",`${-0.6*PX} ${-0.6*PX} ${(W+1.2)*PX} ${(H+1.2)*PX}`);
  let s=`<rect x="${-0.6*PX}" y="${-0.6*PX}" width="${(W+1.2)*PX}" height="${(H+1.2)*PX}" fill="var(--panel)" data-pbg="1"/>`;
  for(let x=0;x<=W;x+=0.5) s+=`<line x1="${x*PX}" y1="0" x2="${x*PX}" y2="${H*PX}" stroke="var(--line)" stroke-width="${x%1?0.5:1}" pointer-events="none"/>`;
  for(let y=0;y<=H;y+=0.5) s+=`<line x1="0" y1="${y*PX}" x2="${W*PX}" y2="${y*PX}" stroke="var(--line)" stroke-width="${y%1?0.5:1}" pointer-events="none"/>`;
  for(let x=0;x<=W;x++) s+=`<text x="${x*PX}" y="-10" font-size="10" text-anchor="middle" fill="var(--muted)" pointer-events="none">${x}</text>`;
  for(let y=1;y<=H;y++) s+=`<text x="-12" y="${y*PX+3}" font-size="10" text-anchor="end" fill="var(--muted)" pointer-events="none">${y}</text>`;
  P.rooms.forEach((r,i)=>{ const sel=S.psel===r.id;
    s+=`<g data-proom="${r.id}"><rect x="${r.x*PX}" y="${r.y*PX}" width="${r.w*PX}" height="${r.h*PX}" fill="${RCOL[i%RCOL.length]}" fill-opacity=".75" stroke="${sel?"var(--blue)":"#5b616b"}" stroke-width="${sel?4:3}"/>`
      +`<text x="${(r.x+r.w/2)*PX}" y="${(r.y+r.h/2)*PX-4}" font-size="13" font-weight="700" text-anchor="middle" fill="#2b2f36">${esc(r.name)}</text>`
      +`<text x="${(r.x+r.w/2)*PX}" y="${(r.y+r.h/2)*PX+12}" font-size="10.5" text-anchor="middle" fill="#4a4f57">${fmt(r.w,1)} × ${fmt(r.h,1)} м · ${fmt(r.w*r.h,1)} м²</text></g>`;
    if(sel) s+=`<circle data-pdrag="room:${r.id}:move" cx="${(r.x+r.w/2)*PX}" cy="${(r.y+r.h/2)*PX+30}" r="13" fill="var(--blue)" stroke="#fff" stroke-width="2" style="touch-action:none"/><text x="${(r.x+r.w/2)*PX}" y="${(r.y+r.h/2)*PX+34}" font-size="12" text-anchor="middle" fill="#fff" pointer-events="none">✥</text>`
      +`<rect data-pdrag="room:${r.id}:size" x="${(r.x+r.w)*PX-12}" y="${(r.y+r.h)*PX-12}" width="24" height="24" rx="4" fill="var(--blue)" stroke="#fff" stroke-width="2" style="touch-action:none"/>`; });
  if(S.proomA) s+=`<circle cx="${S.proomA.x*PX}" cy="${S.proomA.y*PX}" r="7" fill="var(--blue)"/>`;
  // траси
  const det=S.planDet||{}; let k=0;
  for(const g of groupsOf()){ const dd=det[g.id]; if(!dd) continue; const off=(k++%5)*3-6, c=g.group.color; let cur={x:P.board.x+0.3,y:P.board.y+0.15}, d=`M${cur.x*PX+off} ${cur.y*PX+off}`;
    for(const it of dd.order){ d+=` H${it.x*PX+off} V${it.y*PX+off}`; cur=it; }
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.6" stroke-dasharray="7 4" stroke-linejoin="round" pointer-events="none"/>`;
    const f=dd.order[0]; s+=`<text x="${(f.x+P.board.x)/2*PX}" y="${P.board.y*PX+off-6}" font-size="10" font-weight="700" fill="${c}" text-anchor="middle" pointer-events="none" style="paint-order:stroke;stroke:var(--panel);stroke-width:3px">${esc(desig(g))} · ${fmt(S.planLen[g.id],1)} м</text>`; }
  // щит
  const b=P.board; s+=`<g data-pdrag="board" style="touch-action:none"><rect x="${b.x*PX}" y="${b.y*PX}" width="${0.6*PX}" height="${0.3*PX}" rx="3" fill="#fade2a" stroke="${S.psel==="board"?"var(--blue)":"#8a6d00"}" stroke-width="${S.psel==="board"?3:1.5}"/><text x="${(b.x+0.3)*PX}" y="${(b.y+0.15)*PX+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#222">ЩР</text></g>`;
  // точки
  for(const it of P.items){ const g=gById(it.g), c=g?g.group.color:"#8f93a2", x=it.x*PX, y=it.y*PX, sel=S.psel===it.id; let ic="";
    if(it.type==="s"||it.type==="s2"){ const n=it.type==="s2"?2:1; for(let j=0;j<n;j++){ const cx=x+(n===2?(j?7:-7):0); ic+=`<circle cx="${cx}" cy="${y}" r="8" fill="#fff" stroke="${c}" stroke-width="2.5"/><path d="M${cx-8} ${y} a8 8 0 0 1 16 0z" fill="${c}"/>`; } }
    if(it.type==="sw") ic=`<circle cx="${x}" cy="${y}" r="7" fill="#fff" stroke="${c}" stroke-width="2.5"/><line x1="${x+3}" y1="${y-3}" x2="${x+13}" y2="${y-13}" stroke="${c}" stroke-width="2.5"/>`;
    if(it.type==="lt") ic=`<circle cx="${x}" cy="${y}" r="11" fill="#fffbe0" stroke="${c}" stroke-width="2.5"/><path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="${c}" stroke-width="2"/>`;
    if(it.type==="ap") ic=`<rect x="${x-12}" y="${y-9}" width="24" height="18" rx="3" fill="#fff" stroke="${c}" stroke-width="2.5"/><text x="${x}" y="${y+4}" font-size="9" font-weight="700" text-anchor="middle" fill="#222">${esc((it.label||"П").slice(0,3))}</text>`;
    s+=`<g data-pitem="${it.id}" data-pdrag="item:${it.id}" style="touch-action:none">${sel?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="var(--blue)" stroke-width="2.5"/>`:""}<circle cx="${x}" cy="${y}" r="16" fill="transparent"/>${ic}`
      +`<text x="${x+12}" y="${y+19}" font-size="8.5" fill="var(--muted)" pointer-events="none">${g?esc(desig(g)):"без групи"}${it.h!==undefined||PIT[it.type][1]!==null?" · h "+fmt(itemH(it),1):""}</text></g>`; }
  svg.innerHTML=s; }

// ---- Інструменти плану (у панелі внизу)
function planToolsHTML(){ const P=planObj(), G=groupsOf(), t=S.ptool||"sel", det=S.planDet||{};
  let s=`<div class="row"><span class="lbl">Інструмент</span>${PTOOLS.map(([k,l])=>`<button class="chip" data-ptool="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div>`;
  if(["s","s2","sw","lt","ap"].includes(t)) s+=`<div class="row"><span class="lbl">Група</span>${G.length?G.map(g=>`<button class="chip" data-pgrp="${g.id}" aria-pressed="${S.pgrp===g.id}"><span class="sw" style="background:${g.group.color}"></span>${esc(desig(g))} ${esc(g.group.name)}</button>`).join(""):`<span class="hint">Спершу поставте групові автомати на щит</span>`}</div>`;
  s+=`<div class="row"><span class="lbl">Стеля</span>${[2.5,2.7,3,3.2].map(v=>`<button class="chip mono" data-pceil="${v}" aria-pressed="${P.ceil===v}">${fmt(v,1)} м</button>`).join("")}</div>`;
  s+=`<div class="row"><span class="lbl">Траса</span><button class="chip" data-proute="ceil" aria-pressed="${P.route==="ceil"}">По стелі</button><button class="chip" data-proute="floor" aria-pressed="${P.route==="floor"}">По підлозі</button><span class="lbl">Запас</span>${[0,10,15].map(v=>`<button class="chip mono" data-pres="${v}" aria-pressed="${P.res===v}">${v} %</button>`).join("")}</div>`;
  const rows=G.filter(g=>det[g.id]).map(g=>{ const dd=det[g.id], u=groupDU(g); return `<tr><td><span class="sw" style="background:${g.group.color}"></span> ${esc(desig(g))} ${esc(g.group.name)}</td><td class="n">${dd.order.length}</td><td class="n">${fmt(dd.hz,1)}</td><td class="n">${fmt(dd.vt,1)}</td><td class="n"><b>${fmt(dd.tot,1)}</b></td><td class="n"${u>4?' style="color:var(--red)"':""}>${u===null?"—":fmt(u,1)}</td></tr>`; }).join("");
  s+=rows?`<div class="ptab"><table><thead><tr><th>Група</th><th>Точок</th><th>Гориз., м</th><th>Верт., м</th><th>Разом, м</th><th>ΔU, %</th></tr></thead><tbody>${rows}</tbody></table></div>`
    +`<p class="hint">Траса: від щита до найближчої точки, далі до наступної, по осях; спуски від стелі (або підйоми від підлоги) до кожної точки й назад; +0,3 м на кожне підключення і 0,5 м у щиті; запас ${P.res} %.</p>`
    :`<p class="hint">Намалюйте кімнати, поставте щит і точки (розетки, вимикачі, світло) та прив’яжіть їх до груп — довжини кабелів порахуються самі.</p>`;
  s+=`<div class="row"><button class="btn" data-pdemo>${P.rooms.length?"Замінити прикладом квартири":"Приклад: квартира 2 кімнати"}</button><button class="btn" data-pdocs>Документи</button>${P.rooms.length||P.items.length?`<button class="btn danger" data-pclear>Очистити план</button>`:""}</div>`;
  return s; }
function planHint(){ const t=S.ptool||"sel";
  return t==="room"?(S.proomA?"Торкніться протилежного кута кімнати.":"Кімната: торкніться одного кута, потім протилежного."):t==="board"?"Торкніться місця, де висить щит."
    :t==="del"?"Торкніться точки або кімнати, щоб видалити.":t==="sel"?"Торкніться кімнати чи точки, щоб змінити. Перетягуйте точки й щит; кімнату — за синій кружок, розмір — за квадрат."
    :`${PIT[t][0]}: торкніться плану, щоб поставити. ${S.pgrp&&gById(S.pgrp)?"Група "+desig(gById(S.pgrp)):"Оберіть групу внизу."}`; }
function renderPlanSheet(){ const P=planObj(), sh=$("sheet"), r=P.rooms.find(x=>x.id===S.psel), it=P.items.find(x=>x.id===S.psel); if(!r&&!it){ sh.hidden=true; return; } sh.hidden=false; let s="";
  if(r) s=`<div class="sheet-h"><b>Кімната · ${esc(r.name)}</b><button class="btn" data-psx>Готово</button></div><div class="row nowrap"><span class="lbl">Назва</span><input class="inp" data-prname value="${esc(r.name)}" maxlength="30"></div>`
    +`<div class="row"><span class="lbl">Розмір, м</span><input class="inp num" type="number" step="0.1" min="0.5" data-prw value="${r.w}"> × <input class="inp num" type="number" step="0.1" min="0.5" data-prh value="${r.h}"><span class="hint">${fmt(r.w*r.h,1)} м²</span></div>`
    +`<div class="row"><button class="btn danger" data-pdel="${r.id}">Видалити кімнату</button></div>`;
  if(it){ const G=groupsOf(); s=`<div class="sheet-h"><b>${PIT[it.type][0]}${it.label?" · "+esc(it.label):""}</b><button class="btn" data-psx>Готово</button></div>`
    +`<div class="row"><span class="lbl">Група</span>${G.map(g=>`<button class="chip" data-pig="${g.id}" aria-pressed="${it.g===g.id}"><span class="sw" style="background:${g.group.color}"></span>${esc(desig(g))} ${esc(g.group.name)}</button>`).join("")||`<span class="hint">Немає груп</span>`}</div>`
    +`<div class="row"><span class="lbl">Висота, м</span>${[0.3,0.9,1.1,1.8].map(v=>`<button class="chip mono" data-pih="${v}" aria-pressed="${itemH(it)===v}">${fmt(v,1)}</button>`).join("")}<button class="chip" data-pih="ceil" aria-pressed="${it.h===undefined&&PIT[it.type][1]===null}">стеля</button></div>`
    +(it.type==="ap"?`<div class="row nowrap"><span class="lbl">Прилад</span><input class="inp" data-pilab value="${esc(it.label||"")}" maxlength="20" placeholder="Бойлер, плита…"></div>`:"")
    +`<div class="row"><button class="btn danger" data-pdel="${it.id}">Видалити точку</button></div>`; }
  $("sheetIn").innerHTML=s; }

// ---- Приклад: квартира з двох кімнат; точки прив’язуються до груп за назвою
function planDemo(){ const P=planObj(); P.rooms=[{id:uid("r"),name:"Передпокій",x:0,y:0,w:2.6,h:3.2},{id:uid("r"),name:"Кухня",x:2.6,y:0,w:3.4,h:3.2},{id:uid("r"),name:"Зал",x:0,y:3.2,w:4.4,h:4.2},
    {id:uid("r"),name:"Спальня",x:4.4,y:3.2,w:3.6,h:4.2},{id:uid("r"),name:"Ванна",x:6,y:0,w:2,h:3.2}];
  P.board={x:0.3,y:0.1}; P.items=[]; const G=groupsOf(), find=re=>G.find(g=>re.test(g.group.name)), light=find(/світл|освітл/i), kit=find(/кух/i), bath=find(/ванн|сануз/i), stove=find(/плит|духов/i), sock=find(/зал|кімнат|спальн|вітальн/i)||G.find(g=>/розет/i.test(g.group.name)&&g!==kit)||G[0];
  const I=(type,x,y,g,ex)=>P.items.push(Object.assign({id:uid("pi"),type,x,y,g:g?g.id:null},ex||{}));
  if(light){ I("lt",1.3,1.6,light); I("lt",4.3,1.6,light); I("lt",2.2,5.3,light); I("lt",6.2,5.3,light); I("lt",7,1.6,light); I("sw",2.4,0.6,light); I("sw",2.8,2.9,light); I("sw",0.8,3.4,light); I("sw",4.6,3.4,light); I("sw",5.8,0.6,light); }
  if(kit){ I("s2",3.4,0.2,kit,{h:1.1}); I("s2",4.6,0.2,kit,{h:1.1}); I("s",5.8,1.5,kit); }
  if(stove) I("ap",5.8,2.6,stove,{label:"Плита",h:0.6});
  if(bath){ I("s",7.8,2.6,bath,{h:1.1}); I("ap",7.4,0.2,bath,{label:"Бойлер",h:1.8}); }
  if(sock){ I("s2",0.2,5,sock); I("s",2,7.2,sock); I("s2",4.2,6.2,sock); I("s2",7.8,4.8,sock); I("s",5.4,7.2,sock); }
  S.psel=null; }

// ---- Події плану
const svgPt = e => { const svg=$("svg"), m=svg.getScreenCTM(); if(!m) return {x:0,y:0}; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return {x:p.x/PX, y:p.y/PX}; };
let PDRAG=null;
$("svg").addEventListener("pointerdown",e=>{ if(S.mode!=="plan"||(S.ptool||"sel")!=="sel") return; const el=e.target.closest("[data-pdrag]"); if(!el) return;
  const P=planObj(), [kind,id,how]=el.dataset.pdrag.split(":"), p=svgPt(e); let obj=kind==="board"?P.board:kind==="item"?P.items.find(x=>x.id===id):P.rooms.find(x=>x.id===id); if(!obj) return;
  PDRAG={kind,id,how,obj,p0:p,o0:{x:obj.x,y:obj.y,w:obj.w,h:obj.h},moved:false}; try{ el.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); });
$("svg").addEventListener("pointermove",e=>{ if(!PDRAG) return; const p=svgPt(e), dx=p.x-PDRAG.p0.x, dy=p.y-PDRAG.p0.y; if(Math.abs(dx)+Math.abs(dy)<0.05&&!PDRAG.moved) return; PDRAG.moved=true; const o=PDRAG.obj, o0=PDRAG.o0;
  if(PDRAG.how==="size"){ o.w=Math.max(0.5,snapM(o0.w+dx)); o.h=Math.max(0.5,snapM(o0.h+dy)); } else { o.x=Math.max(0,snapM(o0.x+dx)); o.y=Math.max(0,snapM(o0.y+dy)); } renderPlan(); e.preventDefault(); });
$("svg").addEventListener("pointerup",e=>{ if(!PDRAG) return; const d=PDRAG; PDRAG=null; if(d.moved){ S.pnoClick=Date.now()+300; commit(false); renderTools(); } });

  {type:"floor",name:"Тепла підлога 1,5 кВт",pre:"EK",t:{L:["L","L"],N:["N","N"]}},
  {type:"valve",name:"Кран з електроприводом",pre:"YV",t:{N:["N","N"],O:["Відкр","L"],Cl:["Закр","L"]}},

  {type:"invpv",name:"Інвертор мережевий (вхід PV)",pre:"UZ",t:{p:["PV+","DC+"],m:["PV−","DC-"]}},
  {type:"inv",name:"Гібридний інвертор 6 кВт",pre:"UZ",one:true,t:{pp:["PV+","DC+"],pm:["PV−","DC-"],bp:["B+","DC+"],bm:["B−","DC-"],gL:["G-L","L"],gN:["G-N","N"],oL:["O-L","L"],oN:["O-N","N"],pe:["PE","PE"]}},
  {type:"bat",name:"АКБ 51 В · 10 кВт·год",pre:"GB",one:true,t:{p:["+","DC+"],m:["−","DC-"]}}];
function addField(type){ const L=FIELD_LIB.find(x=>x.type===type);
  if(L.one&&S.field.some(f=>f.type===type)){ toast("Такий пристрій може бути лише один","w"); return; }
  if(type==="invpv"&&S.field.some(f=>f.type==="invpv")){ toast("Мережевий інвертор може бути лише один","w"); return; }
  let n=1; while(S.field.some(f=>f.name===L.pre+n)) n++; const name=L.pre+n, map={};
  for(const [t,[lbl,role]] of Object.entries(L.t)){ let key=(name+lbl).replace(/[:\s]/g,""); while(S.board.xt.some(x=>x.k===key)) key+="_"; S.board.xt.push({k:key,l:name+" "+lbl,r:role}); map[t]="xt:"+key; }
  const extra={name}; if(type==="pv"){ let s=1; while(S.field.some(f=>f.sid==="pv"+s)) s++; extra.sid="pv"+s; extra.n=10; if(S.env.sun===undefined) S.env.sun=60; }
  if(type==="bat"&&S.env.soc===undefined) S.env.soc=70;
  S.field.push(mkField(type,map,extra)); GEO=null; S.fldOpen=false; commit(); toast(`${name} додано: його клеми — на клемнику XT1 унизу щита`,"ok"); }
function removeField(f){ const keys=Object.values(f.map); S.field=S.field.filter(x=>x!==f); S.board.xt=S.board.xt.filter(x=>!keys.includes("xt:"+x.k));
  S.wires=S.wires.filter(w=>!keys.includes(w.a)&&!keys.includes(w.b)); S.selDev=null; GEO=null; commit(); }
function renderFieldSheet(f){ const L=FIELD_LIB.find(x=>x.type===f.type)||{name:FT[f.type].name};
  let s=`<div class="sheet-h"><b>${esc(f.name||desig(f))} · ${esc(L.name)}</b><button class="btn" id="sheetClose">Готово</button></div>`;
  s+=`<p class="hint" style="margin:0">Клеми на XT1: ${Object.values(f.map).map(k=>esc(termName(k).replace(/^Клема XT1 /,""))).join(", ")}</p>`;
  if(f.type==="pv") s+=`<div class="row"><span class="lbl">Панелей</span>${[6,8,10,12].map(n=>`<button class="chip mono" data-pvn="${n}" aria-pressed="${f.n===n}">${n}</button>`).join("")}<span class="hint">Voc ≈ ${Math.round((f.n||10)*49.6)} В</span></div>`;

function surgeAll(){ const f=build({ideal:true}), pe=S.board.inputs.find(i=>i.terms.includes("PE"));
  const ac=S.board.inputs.filter(i=>i.terms.includes("N")&&i.terms.some(t=>/^L/.test(t)));
  if(ac.length){ const ph=ac.flatMap(i=>i.terms.filter(t=>/^L/.test(t)).map(t=>f(i.id+":"+t)));
    const ok=S.devices.filter(d=>(d.type==="spdac"||d.type==="spd3")&&(d.wear||0)<2&&pe&&f(k(d,"pe"))===f(pe.id+":PE")&&ph.includes(f(k(d,d.type==="spd3"?"L1":"L"))));
    if(ok.length){ ok.forEach(d=>{ d.wear=(d.wear||0)+1; }); logp("ok",`Імпульс з мережі: ${ok.map(desig).join(", ")} відвів його на PE`); toast("УЗІП відвів імпульс","ok"); }
    else { logp("e","Імпульс з мережі пройшов у щит: немає справного УЗІП AC між фазою, N і PE — техніка під загрозою"); toast("Імпульс пройшов у щит без УЗІП","e"); } }
  if(S.field.some(x=>x.type==="pv")&&S.field.some(x=>x.type==="invpv")) surge(); }

  for(const f of S.field){ if(f.type==="motor1") c.push({type:"toggle",label:`${f.name}: конденсатор справний`,get:()=>f.cap!==false,set:v=>{ f.cap=v; }});
    if(/^motor/.test(f.type)) c.push({type:"toggle",label:`${f.name}: вал заклинило`,get:()=>!!f.jam,set:v=>{ f.jam=v; }});

    if(/^inv/.test(f.type)) c.push({type:"btn",label:`${f.name}: відремонтувати`,act:()=>{ f.dead=false; f.faultT=0; }}); }
  const sb=S.devices.filter(d=>d.type==="sbp"||d.type==="sbs"); for(const d of sb) c.push({type:"btn",label:`${desig(d)} ${d.type==="sbp"?"Пуск":"Стоп"}`,cls:d.type==="sbp"?"go":"stop",act:()=>livePress(d)});
  if(b.inputs.some(i=>i.terms.includes("N"))||S.field.some(f=>f.type==="pv")) c.push({type:"btn",label:"Удар блискавки поруч",act:surgeAll});

function autoStatus(){ const R=S.sim, rows=[];
  for(const i of S.board.inputs) if(i.terms.some(t=>/^L/.test(t))){ const s=S.src[i.id]||{};
    if(i.inv){ rows.push(...invRows(i)); continue; }
    rows.push([i.label,s.on?Math.round(s.U*(i.terms.includes("L1")?1.732:1))+" В":"вимкнено",s.on?"ok":""]); }
  rows.push(["Навантаження",fmt(totalKW(),2)+" кВт",""]);
  for(const f of S.field){ if(/^motor/.test(f.type)) rows.push([f.name,f.run?(f.dir<0?"обертається вліво":"обертається"):f.hum?"гуде, не обертається":"стоїть",f.run?"ok":f.hum?"e":""]);
    if(f.type==="inv") rows.push([f.name,({grid:"мережевий",backup:"резервний",off:"вимкнено",fault:"захист"})[f.mode]||"—",f.mode==="grid"?"ok":f.mode==="fault"?"e":"w"]);

    if(f.type==="valve") rows.push([f.name,f.pos>=100?"відкрито":f.pos<=0?"закрито":"рух",""]);
    if(["lamp","boiler","floor"].includes(f.type)) rows.push([f.name,f.on?"працює":"без живлення",f.on?"ok":""]); }
  if(S.field.some(f=>f.type==="bat")) rows.push(["Заряд АКБ",fmt(S.env.soc||0,0)+" %",""]);
  if(S.env.arc) rows.push(["Дуга DC","ГОРИТЬ","e"]); return rows; }

function selectWire(id){ S.selWire=id; S.moveEnd=null; S.pend=null; S.selDev=null; renderAll(false); renderTools(); }
function renderWireSheet(w){ const sh=$("sheet"); sh.hidden=false; const me=S.moveEnd&&S.moveEnd.id===w.id?S.moveEnd.end:null, colKey=wColKey(w);
  let s=`<div class="sheet-h"><b>Дріт ${wNo(w)} з ${S.wires.length} · ${esc(wireLabel(w))}</b><div class="row nowrap"><button class="btn" data-wnav="-1" aria-label="Попередній дріт">◀</button><button class="btn" data-wnav="1" aria-label="Наступний дріт">▶</button><button class="btn" id="wClose">Готово</button></div></div>`;
  if(me) s+=`<div class="wmove">Торкніться нової клеми для ${me==="a"?"початку":"кінця"} дроту. <button class="btn" data-wmove="cancel">Скасувати перенесення</button></div>`;
  s+=`<div class="wends">${["a","b"].map(e=>`<div class="wend${me===e?" on":""}"><span class="lbl">${e==="a"?"Початок":"Кінець"}</span><span class="wterm">${esc(termName(w[e]))}</span><button class="btn" data-wmove="${e}">Перенести</button></div>`).join("")}</div>`;
  s+=`<div class="row"><span class="lbl">Вид</span>`+Object.keys(WK).map(x=>`<button class="chip" data-skind="${x}" aria-pressed="${w.kind===x}">${swatch(x)}${WK[x][0]}</button>`).join("")+`</div>`;
  s+=`<div class="row"><span class="lbl">Колір</span><button class="chip" data-scol="" aria-pressed="${!w.col}">За видом</button>`+Object.keys(WCOL).map(c=>`<button class="chip" data-scol="${c}" aria-pressed="${w.col===c}">${swatch(c,true)}${WCOL[c][0]}</button>`).join("")+`</div>`;
  s+=`<div class="row"><span class="lbl">Переріз</span>`+SECS.map(x=>`<button class="chip mono" data-ssec="${x}" aria-pressed="${w.sec===x}">${fmt(x,x%1?1:0)}</button>`).join("")+`<span class="hint" style="flex:0 0 auto">мм²</span></div>`;
  s+=`<div class="row"><button class="btn" data-wall="sec">Цей переріз — усім дротам лінії</button><button class="btn danger" data-wdel>Видалити дріт</button></div>`;
  if(colKey&&((PHK.includes(w.kind)||w.kind==="C")&&(colKey==="blue"||colKey==="pe")||w.kind==="N"&&colKey!=="blue"||w.kind==="PE"&&colKey!=="pe"||w.kind!=="PE"&&colKey==="pe"))
    s+=`<p class="wwarn">Колір не за правилами: синій — лише нуль N, жовто-зелений — лише PE. Перевірка схеми покаже це як помилку.</p>`;
  $("sheetIn").innerHTML=s; }
function wireListHTML(){ if(!S.wires.length) return "";
  return `<details class="dd2" id="wireDD"${S.wListOpen?" open":""}><summary><span>Усі дроти</span><span class="cnt">${S.wires.length}</span></summary><div class="wlist">`
    +S.wires.map((w,i)=>`<button class="wli" data-wsel="${w.id}" aria-pressed="${S.selWire===w.id}">${swatch(w.col||w.kind,!!w.col)}<span class="wli-t"><b>${i+1}. ${esc(wireLabel(w))}</b><small>${esc(termName(w.a))} → ${esc(termName(w.b))}</small></span></button>`).join("")+`</div></details>`; }
function lineWires(w){ // дроти того ж виду, з’єднані без апаратів (одна «лінія»)
  const f=build({allOpen:true}), r=f(w.a); return S.wires.filter(x=>x.kind===w.kind&&f(x.a)===r); }
function moveEnd(key){ const m=S.moveEnd, w=wireById(m.id); if(!w){ S.moveEnd=null; return; }
  const other=m.end==="a"?w.b:w.a;
  if(key===other){ toast("Обидва кінці не можуть бути на одній клемі","w"); return; }
  if(S.wires.some(x=>x!==w&&((x.a===key&&x.b===other)||(x.b===key&&x.a===other)))){ toast("Такий дріт уже є","w"); return; }
  if(S.wires.filter(x=>x!==w&&(x.a===key||x.b===key)).length>=2&&!/^x(n|pe):/.test(key)) toast("Під одну клему — не більше двох дротів","w");
  w[m.end]=key; S.moveEnd=null; toast(`Перенесено на ${termName(key)}`,"ok"); commit(false); renderTools(); }
document.addEventListener("click",e=>{ const q=s=>e.target.closest(s); let el; const w=S.selWire&&wireById(S.selWire);
  if(el=q("[data-wsel]")){ selectWire(el.dataset.wsel); $("scroller").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(!w) return;
  if(el=q("[data-skind]")){ w.kind=el.dataset.skind; commit(false); renderTools(); return; }
  if(el=q("[data-scol]")){ w.col=el.dataset.scol||undefined; if(!w.col) delete w.col; commit(false); renderTools(); return; }
  if(el=q("[data-ssec]")){ w.sec=+el.dataset.ssec; commit(false); renderTools(); return; }
  if(q("[data-wall]")){ const L=lineWires(w); L.forEach(x=>x.sec=w.sec); toast(`Переріз ${fmt(w.sec,w.sec%1?1:0)} мм² — для ${L.length} дрот${L.length===1?"у":"ів"} лінії`,"ok"); commit(false); renderTools(); return; }
  if(q("[data-wdel]")){ S.wires=S.wires.filter(x=>x!==w); S.selWire=null; S.moveEnd=null; toast("Дріт видалено. «Скасувати» поверне його"); commit(); return; }
  if(el=q("[data-wmove]")){ const v=el.dataset.wmove; S.moveEnd=v==="cancel"?null:{id:w.id,end:v}; S.pend=null; renderAll(false); return; }
  if(el=q("[data-wnav]")){ const i=S.wires.indexOf(w), n=S.wires.length; selectWire(S.wires[(i+(+el.dataset.wnav)+n)%n].id); return; }
  if(q("#wClose")){ S.selWire=null; S.moveEnd=null; renderAll(true); return; } });
document.addEventListener("keydown",e=>{ if(S.mode!=="wire"||!S.selWire||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); document.querySelector("[data-wdel]")?.click(); }
  if(e.key==="Escape"){ S.selWire=null; S.moveEnd=null; renderAll(true); } });
document.addEventListener("toggle",e=>{ if(e.target.id==="wireDD") S.wListOpen=e.target.open; },true);
/* ===== Старт ===== */
(function init(){
  const db=projDB(); let ok=false;
  if(load()&&(TPL[S.tpl]||S.tpl==="custom")){ S.tplObj=TPL[S.tpl]||TPL.custom; S.env0=S.env0||JSON.parse(JSON.stringify(S.env)); ok=true; }
  if(!ok) applyTemplate("flat");
  if(S.proj&&S.proj.id&&!db.list.some(p=>p.id===S.proj.id)) S.proj={id:null,name:S.proj.name};
  if(!S.proj) S.proj={id:null,name:(S.tplObj&&S.tplObj.name)||"Мій щит"};
  if(!S.baseSig) S.baseSig=structSnap();
  resetHistory(); commit(); tplLabel(); renderProjBtn();
})();

// На широкому екрані щит одразу вписується у висоту
(function(){ const fit=()=>{ if(window.innerWidth>=900&&S.mode!=="plan"){ const z=fitZoom(); if(z<1){ S.zoom=z; renderAll(false); } } }; setTimeout(fit,50); let t=null; window.addEventListener("resize",()=>{ clearTimeout(t); t=setTimeout(fit,200); }); })();
</script></body></html>
